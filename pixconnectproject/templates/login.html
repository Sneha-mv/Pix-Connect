{% extends 'base.html' %}
{% load static %}
{% block title %} 
    Sign In
{% endblock %}
{% block content %}
<div class="log-sec1">
   <div class="container log-sec2" id="container">
        <div class="form-container sign-in">
            <form action="" method="post">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" placeholder="Password" name="password">
                <a href="{% url 'forgot_password' %}" style="color: black;margin-top: 15px;text-decoration: none;font-size: 15px;">Forgot your password?</a>
                <button type="submit" style="margin-top: 15px;margin-left: 5px;">Log In</button>
            </form>
            {% if messages %}
            <div class="message-box">
                {% for message in messages %}
                    <div class="message {{ message.tags }}" style="margin-top: 30px;margin-left: 110px;padding-left: 10px;font-size: 13px;">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-right">
                    <h1 style="font-family: 'Times New Roman', Times, serif;font-weight: bold;">Hello,Friend!</h1>
                    <p>If you don't have an account</p>
                    <a href="{% url 'register' %}"><button>Sign Up</button></a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>

.message-box {
    margin-top: -490px;
    margin-inline-start: -100px;
    width: 630px;
}

.message {
    padding: 10px;
    border-radius: 3px;
    margin-bottom: 10px;
    padding-left: 130px;
    font-weight: bold;
}

.message.success {
    background-color: #dff0d8;
    color: #3c763d;          
    border-left: 4px solid #3c763d; 
}

.message.error {
    background-color: #f2dede; 
    color: #a94442;           
    border-left: 4px solid #a94442; 
}

.message.password-length-error {
    background-color: #f2dede; 
    color: #a94442;           
    border-left: 4px solid #a94442; 
    padding-left: 70px;
}

.log-sec1 {
    height: 600px;
    background-color: #c9d6ff;
    background: linear-gradient(to right,#e2e2e2,#c9d6ff);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    height: 87vh;
}

.log-sec2 {
    background-color: #fff;
    border-radius: 30px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
    width: 768px;
    max-width: 100%;
    min-height: 480px;
}

.log-sec2 p {
    font-size: 14px;
    line-height: 20px;
    letter-spacing: 0.3px;
    margin: 20px 0;
}

.log-sec2 span {
    font-size: 12px;
}

.log-sec2 a {
    color: #333;
    font-size: 18px;
    text-decoration: none;
    margin: 20px 0 10px;
}

.log-sec1 button {
    background-color: #512da8;
    color: #fff;
    font-size: 15px;
    padding: 10px 45px;
    border: 1px solid transparent;
    border-radius: 8px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 3px;
    cursor: pointer;
    margin-left: 30px;
}

.log-sec2 button.hidden {
    background-color: transparent;
    border-color: #fff;
}

.log-sec2 form {
    background-color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0 40px;
    height: 100%;
}

.log-sec2 input {
    background-color: #eee;
    border: none;
    margin: 8px 0;
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 8px;
    width: 100%;
    outline: none;
}

.form-container {
    position: absolute;
    top: 0;
    height: 100%;
    transition: all 0.6s ease-in-out;
}

.sign-in {
    left: 0;
    width: 50%;
    z-index: 2;
}

.log-sec2.active .sign-in {
    transform: translateX(100%);
}

.sign-up {
    left: 0;
    width: 50%;
    opacity: 0;
    z-index: 1;
}

.log-sec2.active .sign-up {
    transform: translateX(100%);
    opacity: 1;
    z-index: 5;
    animation: move 0.6s;
}

@keyframes move{
    0%, 49.99% {
        opacity: 0;
        z-index: 1;
    }
    50%, 100% {
        opacity: 1;
        z-index: 5;
    }
}

.social-icons {
    margin: 20px 0;
}

.social-icons a {
    border: 1px solid #ccc;
    border-radius: 20%;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 0 3px;
    width: 40px;
    height: 40px;
}

.toggle-container {
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    overflow: hidden;
    transition: all 0.6s ease-in-out;
    border-radius: 150px 0 0 100px;
    z-index: 1000;
}

.log-sec2.active .toggle-container {
    transform: translateX(-100%);
    border-radius: 0 150px 100px 0;
}

.toggle {
    background-color: #512da8;
    height: 100%;
    background: linear-gradient(to right,#5c6bc0,#512da8);
    color: #fff;
    position: relative;
    left: -100%;
    height: 100%;
    width: 200%;
    transform: translateX(0);
    transition: all 0.6s ease-in-out;
}

.log-sec2.active .toggle {
    transform: translateX(50%);
}

.toggle-panel {
    position: absolute;
    width: 50%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0 30px;
    text-align: center;
    top: 0;
    transform: translateX(0);
    transition: all 0.6s ease-in-out;
}

.toggle-left {
    transform: translateX(-200%);
}

.log-sec2.active .toggle-left {
    transform: translateX(0);
}

.toggle-right {
    right: 0;
    transform: translateX(0);
}

.log-sec2.active .toggle-right {
    transform: translateX(200%);
}

</style>

{% endblock %}
